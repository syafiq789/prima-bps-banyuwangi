<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="keuanganGrad" x1="10" y1="12" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="keuanganGold" x1="34" y1="12" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Soft emerald backdrop -->
  <circle cx="32" cy="32" r="28" fill="#ECFDF5"/>
  <!-- Modern Wallet / Ledger Body -->
  <rect x="12" y="20" width="38" height="28" rx="7" fill="url(#keuanganGrad)"/>
  <!-- Top flap accent -->
  <path d="M16 20V16.5C16 14.567 17.567 13 19.5 13H41.5C43.433 13 45 14.567 45 16.5V20" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <!-- Financial growth sparkline inside wallet -->
  <path d="M18 39L24 33L29 36.5L37 28" stroke="#A7F3D0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wallet clasp with coin -->
  <rect x="37" y="29" width="16" height="10" rx="5" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
  <circle cx="42" cy="34" r="2.5" fill="url(#keuanganGold)"/>
  <!-- Rupiah / Coin badge top right -->
  <circle cx="48" cy="17" r="7.5" fill="url(#keuanganGold)" stroke="#FFFFFF" stroke-width="2"/>
  <text x="48" y="20.2" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="8.5" font-weight="800">Rp</text>
</svg>
