<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="fullShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E66" />
      <stop offset="50%" stop-color="#142B4A" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="fullOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44" />
      <stop offset="50%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#D96808" />
    </linearGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="fullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="fullShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F28C28" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Emblem Symbol -->
  <g transform="translate(10, 10) scale(0.31)">
    <!-- Outer Shield -->
    <path d="M 256,36 C 360,36 432,68 448,160 C 448,290 358,410 256,468 C 154,410 64,290 64,160 C 80,68 152,36 256,36 Z" 
          fill="url(#fullShieldGrad)" 
          stroke="url(#fullOrangeGrad)" 
          stroke-width="12" 
          filter="url(#fullShadow)" />

    <!-- Document Layers -->
    <path d="M 170,140 L 320,140 C 330,140 338,148 338,158 L 338,300 C 338,310 330,318 320,318 L 170,318 C 160,318 152,310 152,300 L 152,158 C 152,148 160,140 170,140 Z" 
          fill="#38BDF8" transform="rotate(-8 245 229)" opacity="0.85" />
    <path d="M 180,148 L 332,148 C 340,148 348,156 348,164 L 348,312 C 348,320 340,328 332,328 L 180,328 C 172,328 164,320 164,312 L 164,164 C 164,156 172,148 180,148 Z" 
          fill="#F8FAFC" transform="rotate(-3 256 238)" />
    <path d="M 190,160 L 340,160 C 350,160 358,168 358,178 L 358,326 C 358,336 350,344 340,344 L 190,344 C 180,344 172,336 172,326 L 172,178 C 172,168 180,160 190,160 Z" 
          fill="url(#fullOrangeGrad)" />
    <path d="M 330,160 L 358,188 L 330,188 Z" fill="#D96808" />

    <!-- Checkmark -->
    <path d="M 210,265 L 244,298 L 320,215" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Star -->
    <g transform="translate(355, 95)">
      <path d="M 20,0 Q 20,20 40,20 Q 20,20 20,40 Q 20,20 0,20 Q 20,20 20,0 Z" fill="url(#fullGoldGrad)" />
      <circle cx="20" cy="20" r="4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography Right Section -->
  <g transform="translate(180, 25)">
    <!-- Wordmark: PRIMA -->
    <text x="0" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      PRIMA
    </text>

    <!-- Badge BPS -->
    <g transform="translate(235, 24)">
      <rect x="0" y="0" width="70" height="34" rx="8" fill="url(#fullOrangeGrad)" />
      <text x="35" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        BPS
      </text>
    </g>

    <!-- Subtitle: Pusat Arsip dan Manajemen AKIP -->
    <text x="0" y="105" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">
      Pusat Arsip dan Manajemen AKIP
    </text>

    <!-- City: Kabupaten Banyuwangi -->
    <text x="0" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#F28C28" letter-spacing="0.5">
      Badan Pusat Statistik Kabupaten Banyuwangi
    </text>
  </g>
</svg>

