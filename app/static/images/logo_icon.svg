<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E66" />
      <stop offset="50%" stop-color="#142B4A" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>

    <!-- Orange Accent Gradient (BPS Signature) -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44" />
      <stop offset="40%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#D96808" />
    </linearGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>

    <!-- Cyan Data Tech Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F28C28" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0D1B2A" flood-opacity="0.6" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Base -->
  <g filter="url(#shieldGlow)">
    <path d="M 256,36 C 360,36 432,68 448,160 C 448,290 358,410 256,468 C 154,410 64,290 64,160 C 80,68 152,36 256,36 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#orangeGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" />
  </g>

  <!-- Inner Dynamic Accent Arc -->
  <path d="M 256,58 C 342,58 412,86 426,166 C 426,275 348,378 256,432 C 164,378 86,275 86,166 C 100,86 170,58 256,58 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.1" 
        stroke-width="3" />

  <!-- Document / Folder Layers (Arsip Terorganisir) -->
  <g filter="url(#softShadow)">
    <!-- Back Document Page (Cyan Data Layer) -->
    <path d="M 170,140 L 320,140 C 330,140 338,148 338,158 L 338,300 C 338,310 330,318 320,318 L 170,318 C 160,318 152,310 152,300 L 152,158 C 152,148 160,140 170,140 Z" 
          fill="url(#cyanGrad)" 
          transform="rotate(-8 245 229)" 
          opacity="0.85" />

    <!-- Middle Document Page (White/Slate) -->
    <path d="M 180,148 L 332,148 C 340,148 348,156 348,164 L 348,312 C 348,320 340,328 332,328 L 180,328 C 172,328 164,320 164,312 L 164,164 C 164,156 172,148 180,148 Z" 
          fill="#F8FAFC" 
          transform="rotate(-3 256 238)" />

    <!-- Front Prominent Document (Orange BPS Layer) -->
    <path d="M 190,160 L 340,160 C 350,160 358,168 358,178 L 358,326 C 358,336 350,344 340,344 L 190,344 C 180,344 172,336 172,326 L 172,178 C 172,168 180,160 190,160 Z" 
          fill="url(#orangeGrad)" />
          
    <!-- Subtle document folded corner effect -->
    <path d="M 330,160 L 358,188 L 330,188 Z" fill="#D96808" />
  </g>

  <!-- Accountability / SAKIP Checkmark Ribbon (Simbol Akuntabilitas Terjaga) -->
  <g filter="url(#softShadow)">
    <path d="M 210,265 L 244,298 L 320,215" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Excellence Star (Bintang 4 Sisi - Kinerja Prima) -->
  <g transform="translate(355, 95)">
    <!-- Star Glow -->
    <circle cx="20" cy="20" r="18" fill="#FFA726" opacity="0.3" filter="url(#softShadow)" />
    <!-- 4-point Diamond Star -->
    <path d="M 20,0 Q 20,20 40,20 Q 20,20 20,40 Q 20,20 0,20 Q 20,20 20,0 Z" 
          fill="url(#goldGrad)" />
    <circle cx="20" cy="20" r="4" fill="#FFFFFF" />
  </g>

  <!-- Small sparkling starlet -->
  <g transform="translate(130, 110) scale(0.6)">
    <path d="M 20,0 Q 20,20 40,20 Q 20,20 20,40 Q 20,20 0,20 Q 20,20 20,0 Z" 
          fill="#FFE082" />
  </g>

</svg>

